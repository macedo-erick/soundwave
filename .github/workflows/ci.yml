name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Check formatting
        run: yarn format:check

      - name: Lint
        run: yarn lint

      - name: Typecheck
        run: yarn typecheck

      - name: Test
        run: yarn test

  image:
    name: Build image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      # Build only — publishing happens in cd.yml after this workflow passes.
      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: false
          load: true
          tags: soundwave:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify the image starts and validates its config
        run: |
          # No token is supplied, so the bot must exit non-zero with a clear
          # configuration error rather than crashing in an unexpected way.
          output=$(docker run --rm soundwave:ci 2>&1 || true)
          echo "$output"
          echo "$output" | grep -q "Invalid configuration" \
            || { echo "::error::Image did not fail with a config validation error"; exit 1; }
