server:
  port: 2333
  address: 0.0.0.0

lavalink:
  plugins:
    - dependency: 'dev.lavalink.youtube:youtube-plugin:f45bbb7aebfcbc1c553769e04af6cd43afa8b7c3'
      repository: 'https://maven.lavalink.dev/snapshots'
      snapshot: true
    - dependency: 'com.github.topi314.lavasrc:lavasrc-plugin:4.8.3'
      repository: 'https://maven.lavalink.dev/releases'
      snapshot: false

  server:
    password: '${LAVALINK_SERVER_PASSWORD:youshallnotpass}'
    sources:
      youtube: false
      bandcamp: true
      soundcloud: true
      twitch: true
      vimeo: true
      http: true
      local: false
    filters:
      volume: true
      equalizer: true
      karaoke: false
      timescale: true
      tremolo: false
      vibrato: false
      distortion: false
      rotation: false
      channelMix: false
      lowPass: false
    bufferDurationMs: 400
    frameBufferDurationMs: 5000
    opusEncodingQuality: 10
    resamplingQuality: LOW
    trackStuckThresholdMs: 10000
    useSeekGhosting: true
    youtubePlaylistLoadLimit: 6
    playerUpdateInterval: 5
    youtubeSearchEnabled: true
    soundcloudSearchEnabled: true

plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    clients:
      - MUSIC
      - TV
      - IOS
      - ANDROID_VR
      - WEB
      - WEBEMBEDDED
    remoteCipher:
      url: '${YT_CIPHER_URL:http://yt-cipher:8001}'
      password: '${YT_CIPHER_PASSWORD:}'
      userAgent: 'soundwave'
    oauth:
      enabled: true
      refreshToken: '${YT_REFRESH_TOKEN:}'
      skipInitialization: false

  lavasrc:
    sources:
      spotify: true
      applemusic: false
      deezer: false
      yandexmusic: false
    providers:
      - 'ytmsearch:"%ISRC%"'
      - 'ytmsearch:%QUERY%'
    spotify:
      clientId: '${SPOTIFY_CLIENT_ID:}'
      clientSecret: '${SPOTIFY_CLIENT_SECRET:}'
      countryCode: US
      playlistLoadLimit: 6
      albumLoadLimit: 6

metrics:
  prometheus:
    enabled: true

logging:
  level:
    root: INFO
    lavalink: INFO
  request:
    enabled: false
  logback:
    rollingpolicy:
      max-history: 7
      max-file-size: 25MB
