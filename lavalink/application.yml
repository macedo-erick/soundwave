server:
  port: 2333
  address: 0.0.0.0

lavalink:
  plugins:
    - dependency: 'dev.lavalink.youtube:youtube-plugin:1.18.2'
      snapshot: false
    - dependency: 'com.github.topi314.lavasrc:lavasrc-plugin:4.8.3'
      repository: 'https://maven.lavalink.dev/releases'
      snapshot: false

  server:
    password: '${LAVALINK_SERVER_PASSWORD:youshallnotpass}'
    sources:
      youtube: false
      bandcamp: true
      soundcloud: true
      twitch: true
      vimeo: true
      http: true
      local: false
    filters:
      volume: true
      equalizer: true
      karaoke: false
      timescale: true
      tremolo: false
      vibrato: false
      distortion: false
      rotation: false
      channelMix: false
      lowPass: false
    bufferDurationMs: 400
    frameBufferDurationMs: 5000
    opusEncodingQuality: 10
    resamplingQuality: LOW
    trackStuckThresholdMs: 10000
    useSeekGhosting: true
    youtubePlaylistLoadLimit: 6
    playerUpdateInterval: 5
    youtubeSearchEnabled: true
    soundcloudSearchEnabled: true

plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    # Order is the fallback order. MUSIC is search-only and never attempts
    # playback, so it will not appear in an AllClientsFailedException. TV is
    # first because it is the only OAuth-capable client, and OAuth is what gets
    # past "This video requires login" on a datacenter IP. TVHTML5_SIMPLY is the
    # one playback client that needs neither OAuth nor a poToken, so it is the
    # backstop when the refresh token expires.
    clients:
      - MUSIC
      - TV
      - TVHTML5_SIMPLY
      - ANDROID_VR
      - WEB
      - WEBEMBEDDED
    # Signature deciphering is delegated to the yt-cipher container rather than
    # the plugin's bundled extractor. The bundled one can only be fixed by a
    # plugin release; when YouTube rotates base.js in between, every client that
    # gets as far as a format URL dies with "Must find sig function from script".
    #
    # The default must stay a real URL, never empty. The plugin switches to the
    # remote manager on `url != null` and an empty string satisfies that, so a
    # blank value would route every decipher at nothing — and there is no
    # fallback to the local extractor once the remote one is selected.
    remoteCipher:
      url: '${YT_CIPHER_URL:http://yt-cipher:8001}'
      password: '${YT_CIPHER_PASSWORD:}'
      userAgent: 'soundwave'
    oauth:
      enabled: true
      refreshToken: '${YT_REFRESH_TOKEN:}'
      skipInitialization: false

  lavasrc:
    sources:
      spotify: true
      applemusic: false
      deezer: false
      yandexmusic: false
    providers:
      - 'ytsearch:"%ISRC%"'
      - 'ytsearch:%QUERY%'
    spotify:
      clientId: '${SPOTIFY_CLIENT_ID:}'
      clientSecret: '${SPOTIFY_CLIENT_SECRET:}'
      countryCode: US
      playlistLoadLimit: 6
      albumLoadLimit: 6

metrics:
  prometheus:
    enabled: false

logging:
  level:
    root: INFO
    lavalink: INFO
  request:
    enabled: false
  logback:
    rollingpolicy:
      max-history: 7
      max-file-size: 25MB
