# Development overrides, merged automatically by `docker compose up`.
# Production must opt out explicitly: `docker compose -f compose.yaml up -d`.

services:
  soundwave:
    build:
      target: dev
    image: soundwave:dev
    environment:
      NODE_ENV: development
      LOG_LEVEL: ${LOG_LEVEL:-debug}
    volumes:
      - ./src:/app/src:ro
      - ./tsconfig.json:/app/tsconfig.json:ro
      - ./tsconfig.build.json:/app/tsconfig.build.json:ro
      - /app/node_modules
    ports:
      - '9229:9229'

  lavalink:
    ports:
      - '2333:2333'

  # Published in development only, so a failing decipher can be reproduced
  # directly against the API instead of through Lavalink. In production it stays
  # on the compose network, which is what makes the empty password acceptable.
  yt-cipher:
    ports:
      - '8001:8001'
